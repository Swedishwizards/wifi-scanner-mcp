name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      # Optional: sign the helper with a Developer ID so macOS shows no warning.
      # Add these repository secrets to enable it:
      #   MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
      - name: Import signing certificate
        if: env.HAVE_CERT == 'yes'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build macOS helper
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash macos/build.sh

      - name: Pack .mcpb
        run: node scripts/pack.js --require-helper

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb \
            --title "WiFi Scanner $GITHUB_REF_NAME" \
            --notes "Download the .mcpb file and double-click it to install in Claude Desktop (macOS and Windows)."

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/*.mcpb
